[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-cloud-backup"
version = "0.1.1"
description = "Backs up django postgres databases, local folders and S3 folders to Google Drive, S3-compatible storage (AWS, Backblaze B2, Cloudflare R2) or Azure Blob Storage."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ian Jones" },
]
dependencies = [
    "encrypted-credentials",
    "google-client-helper>=0.0.4",
    "requests",
]
keywords = [
    "django", "backup", "postgres", "postgresql", "ransomware", "immutable",
    "object-lock", "worm", "s3", "backblaze", "b2", "cloudflare-r2", "azure",
    "google-drive", "disaster-recovery",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Systems Administration",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
s3 = ["boto3"]
azure = ["azure-storage-blob"]
encryption = ["cryptography"]

[project.urls]
Homepage = "https://github.com/jonesim/django-cloud-backup"
Documentation = "https://github.com/jonesim/django-cloud-backup#readme"
Changelog = "https://github.com/jonesim/django-cloud-backup/releases"
Issues = "https://github.com/jonesim/django-cloud-backup/issues"
Source = "https://github.com/jonesim/django-cloud-backup"

[tool.setuptools.packages.find]
include = ["cloud_backup", "cloud_backup.*"]

[tool.setuptools]
include-package-data = true
